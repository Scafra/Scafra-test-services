[package]
name = "scafra-test-service"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
scafra = {
    git = "https://github.com/Scafra/Scafra",
    branch = "main",
    features = ["standard", "bootui"],
}
scafra-bootui = {
    git = "https://github.com/Scafra/Scafra",
    branch = "main",
}
serde = { version = "1", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
